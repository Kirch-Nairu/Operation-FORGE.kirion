name: Brain Health

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Cognitive OS structure
        run: python tools/brain_health.py --check
