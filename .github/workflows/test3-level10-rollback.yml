name: Forge Test 3 Level 10 Rollback Apocalypse

on:
  push:
    branches:
      - KIRCH-FORGE-ENTITY-EVOLUTION-TEST-3
  workflow_dispatch:

env:
  TEST3_LEVEL10_EVALUATOR_SHA: c8e1e85c5a1a688c87195a81a8a5f72a9ed6327f

jobs:
  level10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/entity_check.py
      - name: Load frozen Level 10 evaluator
        run: git show "$TEST3_LEVEL10_EVALUATOR_SHA:tools/test3_level10_rollback.py" > /tmp/test3_level10_rollback.py
      - run: python /tmp/test3_level10_rollback.py
