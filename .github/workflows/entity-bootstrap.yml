name: Materialize Operation FORGE.kirion

on:
  push:
    branches: [main]
    paths:
      - '.entity-bootstrap/**'
      - '.github/workflows/entity-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Reconstruct validated entity payload
        shell: bash
        run: |
          set -euo pipefail
          cat .entity-bootstrap/chunk*.b64 > /tmp/operation-forge-entity.b64
          base64 -d /tmp/operation-forge-entity.b64 > /tmp/operation-forge-entity.tar.xz
          xz -t /tmp/operation-forge-entity.tar.xz
          tar -tJf /tmp/operation-forge-entity.tar.xz >/dev/null

      - name: Replace bootstrap tree with materialized entity
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/operation-forge-entity.tar.xz -C .

      - name: Commit materialized entity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Operation FORGE.kirion"
          git config user.email "forge-kirion@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Entity tree already materialized."
            exit 0
          fi
          git commit -m "feat(entity): materialize Claude-repaired Forge and Second Brain"
          git push origin HEAD:main
