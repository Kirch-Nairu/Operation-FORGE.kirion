name: Forge Evolution Test 2

on:
  push:
    branches:
      - KIRCH-FORGE-ENTITY-EVOLUTION-TEST-2
  workflow_dispatch:

jobs:
  evaluator-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrated entity validation
        run: python tools/entity_check.py
      - name: Compile repaired evaluator
        run: python -m py_compile tools/evolution_generation3.py
