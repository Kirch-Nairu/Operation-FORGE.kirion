name: Forge Evolution Test 2

on:
  push:
    branches:
      - KIRCH-FORGE-ENTITY-EVOLUTION-TEST-2
  workflow_dispatch:

jobs:
  generation-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrated entity validation
        run: python tools/entity_check.py
      - name: Generation 2 resumable execution evaluator
        run: python tools/evolution_generation2.py
