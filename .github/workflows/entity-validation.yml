name: Validate Operation FORGE.kirion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entity-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout entity
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate integrated entity
        run: python tools/entity_check.py
